services:
  - type: web
    name: portalpulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGINS
        value: "https://bronze-tinsel-n8pb.here.now"
      - key: PORTALPULSE_DEMO_MODE
        value: "1"
      - key: NIRANTAR_DEMO_URL
        value: "https://bronze-tinsel-n8pb.here.now/"
      - key: PYTHONUNBUFFERED
        value: "1"
