name: PortalPulse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Code Linting & Style
  # =========================================================================
  lint:
    name: "Stage 1: Code Linting & Style"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  # =========================================================================
  # Stage 2: Static Type Analysis
  # =========================================================================
  type-check:
    name: "Stage 2: Static Type Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Typing & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy fastapi pydantic uvicorn numpy pandas

      - name: Run Mypy Strict Analysis on backend/
        run: mypy --strict backend/

  # =========================================================================
  # Stage 3: Security & Secret Scan
  # =========================================================================
  security-scan:
    name: "Stage 3: Security & Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit SAST Scan
        run: bandit -r backend/ -ll

      - name: Scan for Hardcoded Secrets and Insecure Keys
        run: |
          echo "Scanning repository for unencrypted keys or exposed tokens..."
          python -c "
          import re, sys, os
          pattern = re.compile(r'(?i)(?:secret|api_key|private_key|aws_access_key_id)\s*[:=]\s*[\"\'][A-Za-z0-9_\-\.]{20,}[\"\']')
          exempt_dirs = {'.git', '.venv', '__pycache__', 'Module1_Data', 'ppt_images'}
          violations = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in exempt_dirs]
              for f in files:
                  if f.endswith(('.py', '.yaml', '.yml', '.env.example', '.json')):
                      p = os.path.join(root, f)
                      with open(p, errors='ignore') as fp:
                          for idx, line in enumerate(fp, 1):
                              if any(k in line.lower() for k in ['test', 'dummy', 'example', 'mock', 'quantum', 'role_', '# nosec']):
                                  continue
                              if pattern.search(line):
                                  violations.append(f'{p}:{idx}: {line.strip()[:60]}')
          if violations:
              print('Potential secrets detected:\n' + '\n'.join(violations))
              sys.exit(1)
          print('Secret scan passed: No unprotected secrets discovered.')
          "

  # =========================================================================
  # Stage 4: Unit & Integration Test Suite
  # =========================================================================
  test-suite:
    name: "Stage 4: Unit & Integration Test Suite"
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install fastapi uvicorn scikit-learn pytest pytest-cov httpx

      - name: Run Pytest with Coverage Threshold
        run: |
          pytest --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=80 tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # Stage 5: Build & Packaging Check
  # =========================================================================
  build-and-package:
    name: "Stage 5: Build & Packaging Check"
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile Syntax
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013

      - name: Build Docker Container Image
        run: |
          docker build -t portalpulse-control-tower:${{ github.sha }} -t portalpulse-control-tower:latest -f Dockerfile .

      - name: Inspect Docker Build Artifact
        run: |
          docker image inspect portalpulse-control-tower:latest --format 'Image ID: {{.Id}} | Size: {{.Size}} bytes'
