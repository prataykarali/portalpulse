version: '3.8'

services:
  portalpulse-api:
    build: .
    container_name: portalpulse-api
    restart: unless-stopped
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/data:/app/backend/data
      - ./dashboard/portalpulse.db:/app/dashboard/portalpulse.db
    depends_on:
      - redis

  portalpulse-dashboard:
    build: .
    container_name: portalpulse-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONTROL_PLANE_URL=http://portalpulse-api:8000
    volumes:
      - ./dashboard/portalpulse.db:/app/dashboard/portalpulse.db
    depends_on:
      - redis
      - portalpulse-api

  redis:
    image: redis:7-alpine
    container_name: portalpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
