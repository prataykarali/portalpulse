# PortalPulse Reverse Proxy & Token Bucket Rate Limiting
limit_req_zone $binary_remote_addr zone=portal_limit:10m rate=50r/s;

upstream portalpulse_app {
    server 127.0.0.1:8501;
    keepalive 64;
}

server {
    listen 80;
    server_name portalpulse.local;

    client_max_body_size 10M;

    location / {
        limit_req zone=portal_limit burst=20 nodelay;

        proxy_pass http://portalpulse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
