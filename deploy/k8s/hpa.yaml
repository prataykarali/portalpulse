apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portalpulse-hpa
  namespace: portalpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portalpulse-backend
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
